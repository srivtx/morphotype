[package]
name = "morpho-wasm"
description = "WebAssembly bindings for the Morphotype engine."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
morpho-core = { path = "../morpho-core" }
wasm-bindgen = "=0.2.129"
serde = "1"
serde_json = "1"
