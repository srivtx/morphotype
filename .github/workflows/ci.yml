name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Engine, web build and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Engine tests
        run: cargo test -p morpho-core
      - name: Build web app
        run: npm run build
      - name: UI unit tests
        run: npx vitest run
      - name: Browser end-to-end
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: test-results/e2e

  # Exports the audit fonts and checks them the way browsers and font
  # libraries will: OTS (the sanitizer in Chrome and Firefox) must accept
  # every file, and fontbakery's universal profile must report no FAIL.
  fonts:
    name: Exported font checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Export the audit fonts
        run: |
          # Absolute: cargo runs the test from crates/morpho-core, not the repo root.
          FONT_AUDIT_OUT="$PWD/font-audit" cargo test -p morpho-core --test font_audit -- --nocapture | tee audit.txt
          # A two-character fixture for the morph fallback, not a real font.
          rm font-audit/morph-missing.ttf
          { echo '### Font export audit'; echo '```'; sed -n '/^case/,/^$/p' audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OTS and fontbakery
        run: pip install opentype-sanitizer==9.2.0 fontbakery==1.1.0
      - name: OTS
        run: for f in font-audit/*.ttf; do python -m ots "$f"; done
      - name: fontbakery
        # contour_count: modifiers change outlines on purpose.
        # STAT/ital_axis: a lone italic export has no Roman to pair with.
        # HTML reports: 1.1.0's --ghmarkdown crashes on a font with no warnings.
        run: |
          status=0
          for f in font-audit/*.ttf; do
            fontbakery check-universal -x contour_count -x opentype/STAT/ital_axis \
              --html "font-audit/$(basename "$f" .ttf)-fontbakery.html" "$f" || status=1
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: font-audit
          path: font-audit

  mac:
    name: macOS app (.dmg)
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build universal app
        run: npx tauri build --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: Morphotype-macOS
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app

  windows:
    name: Windows app (installer)
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app and installer
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Morphotype-Windows
          path: target/release/bundle/nsis/*.exe

  # Publishes a release for the version in package.json the first time it
  # reaches main (or when a v* tag is pushed). Bump the version to ship.
  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [mac, windows, fonts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decide the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.tag.outputs.skip != 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.tag.outputs.skip != 'true'
      - name: Install wasm-bindgen
        if: steps.tag.outputs.skip != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.tag.outputs.skip != 'true'
      - name: Build the web app
        if: steps.tag.outputs.skip != 'true'
        run: |
          npm run build
          (cd dist && zip -qr ../Morphotype-web.zip .)
      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          name: Morphotype-macOS
          path: mac
      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.skip != 'true'
        with:
          name: Morphotype-Windows
          path: windows
      - name: Collect release files
        if: steps.tag.outputs.skip != 'true'
        run: |
          mkdir -p release
          find mac -name '*.dmg' -exec cp {} release/ \;
          find windows -name '*.exe' -exec cp {} release/ \;
          cp Morphotype-web.zip release/
          ls -la release
      - uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Morphotype ${{ steps.tag.outputs.tag }}
          body_path: docs/RELEASE_NOTES.md
          files: release/*
          fail_on_unmatched_files: true
